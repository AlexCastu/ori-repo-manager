name: Release Builds

on:
  push:
    tags:
      - 'v*-windows'
      - 'v*-macos'

env:
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    if: endsWith(github.ref, '-windows')
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    if: endsWith(github.ref, '-macos')
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: macos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri:build

      - name: List build artifacts
        run: |
          echo "Listing bundle directory:"
          ls -la src-tauri/target/release/bundle/ || echo "Bundle dir not found"
          find src-tauri/target/release/bundle -name "*.dmg" -o -name "*.app" || echo "No dmg/app files found"

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
