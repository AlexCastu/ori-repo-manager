name: Release Builds

on:
  push:
    tags:
      - 'v*-windows'
      - 'v*-macos'

env:
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    if: endsWith(github.ref, '-windows')
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    if: endsWith(github.ref, '-macos')
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: macos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri:build

      - name: Find and prepare artifacts
        run: |
          echo "Searching for build artifacts..."
          mkdir -p artifacts

          # Find all .dmg files recursively
          find src-tauri/target -name "*.dmg" -type f -exec cp {} artifacts/ \;

          echo "Found artifacts:"
          ls -lh artifacts/

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
